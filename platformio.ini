; Zehnder ComfoAir Q -- own firmware.
;
; framework = espidf, and there is no arduino environment anywhere in this file.
; AGENTS.md rules the Arduino layer out and criterion 7 makes its absence an
; acceptance criterion; the two lines below are what that criterion checks.
;
; platform = espressif32 resolves to the pioarduino fork, which is the distribution
; that carries a current ESP-IDF and an ESP32-C6 board catalogue.
; Upstream platformio/platform-espressif32 6.x has neither; docs/development/building.md
; ("Why the platform is pinned") is the as-built account.

[env:m5stack-nanoc6]
; PINNED, and the pin is load-bearing. A bare git URL here floats: the first build
; of this project cloned whatever was on the default branch, which turned out to be
; 55.03.311 carrying ESP-IDF 5.5.5 -- while the ESP-IDF facts this firmware relies on
; had been verified against the 5.5.4 tree installed at the time, and the next build
; could have moved again with no change in this repository. Bump this deliberately,
; re-check those facts (the TWAI driver, WebSocket in esp_http_server, esp-mqtt, the
; partition table, EMBED_FILES) against the new tree, and say so.
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.311
framework = espidf
; devkitm-1, not devkitc-1: the NanoC6 has 4 MB of flash and devkitc-1 is the
; 8 MB part. Getting this wrong mis-sizes the partition table silently.
board = esp32-c6-devkitm-1
board_build.partitions = partitions.csv
; pio_version.py re-runs CMake when the firmware version changed (a commit, a tag, a tree turning
; dirty): PlatformIO's own re-configure check does not look at git, so without it the image keeps
; the version of whichever build last configured CMake. See the script's docstring.
extra_scripts =
	pre:tools/regenerate.py
	pre:tools/pio_version.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Host tests belong to [env:native]; they must never be built for the board.
test_ignore = *
build_flags =
	-DPROJECT_NAME_STR=\"comfoair-q\"

; Host tests. AGENTS.md: the protocol layer depends on neither the hardware nor
; the framework, so it is tested natively, and from phase 2 onward -- before the
; first line of on-device code that uses it.
[env:native]
platform = native
test_framework = unity
; One directory per suite: PlatformIO links every .cpp in a directory into a
; single binary, so two files with main() in one directory collide.
test_filter = test_*
; src/ is the firmware entry point and cannot build on the host.
build_src_filter = -<*>
; The components are ESP-IDF components AND PlatformIO libraries at once, so the host
; tests compile the very same sources the device runs -- which is the whole point of
; testing this layer natively (AGENTS.md). The dependency finder pulls in only what a
; test actually includes, so the board- and IDF-bound components are never built here.
lib_extra_dirs = components
; -I test/test_can_transport/idf is the fake ESP-IDF that suite needs: the CAN transport
; is the first component that cannot compile without the framework. The flag is reachable
; only from this environment -- [env:m5stack-nanoc6] sets test_ignore = * and never sees
; it -- so the real driver can never be shadowed on the device. DO NOT promote those
; headers to a shared directory: once two suites share a fake, "it grew a feature for
; suite B" becomes a way to quietly weaken suite A.
; -Wno-missing-field-initializers: Unity's own macros and the IDF config structs are both
; full of partial initialisers, and -Wextra would otherwise bury the real warnings.
; -Werror=switch, and ONLY that one promoted to an error: a switch over an enum that has just
; grown a value is how a phase, a failure class or a PDO type gets added and then silently
; answered "unknown" by the function that is supposed to name it. A warning does not stop that --
; nothing in this tree is built with -Werror, so the fifteenth enumerator lands green and the
; suite stays green with it. DO NOT widen this to plain -Werror: the fakes under test/*/idf and
; Unity's macros are exactly why the rest of -Wextra is advisory here.
build_flags =
	-std=c++17
	-Wall
	-Wextra
	-Werror=switch
	-I components/comfoair_protocol/include
	-I components/comfoair_registry/include
	-I components/comfoair_state/include
	-I components/comfoair_api/include
	-I components/comfoair_policy/include
	-I components/comfoair_lock/include
	-I components/comfoair_secrets/include
	-I components/comfoair_json/include
	-I components/comfoair_wire/include
	-I components/comfoair_command/include
	-I components/comfoair_poll_plan/include
	-I components/comfoair_probe/include
	-I components/comfoair_probe_report/include
	-I components/comfoair_pdo_census/include
	-I components/comfoair_readback/include
	-I components/comfoair_sysinfo/include
	-I components/comfoair_ota/include
	-I components/comfoair_ha/include
	-I components/comfoair_config/include
	-I components/comfoair_log/include
	-I components/comfoair_provision/include
	-I components/comfoair_captive/include
	-I components/comfoair_auth/include
	-I components/board/include
	-I components/comfoair_can/include
	-I components/comfoair_phase/include
	-I components/comfoair_led/include
	-I components/comfoair_button/include
	-I components/comfoair_mqtt_backoff/include
	-I components/comfoair_mdns/include
	-I test/test_can_transport/idf
	-pthread
	-Wno-missing-field-initializers
